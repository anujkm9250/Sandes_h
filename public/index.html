<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f5e63">
  <title>Sandesh</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main id="auth">
    <form id="auth-form" autocomplete="on">
      <h1>Sandesh</h1>
      <p class="tagline">Private chat for you and your friends.</p>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-login" class="active" aria-selected="true">Log in</button>
        <button type="button" role="tab" id="tab-signup" aria-selected="false">Sign up</button>
      </div>
      <label>Username
        <input id="username" name="username" autocomplete="username" autocapitalize="none" required minlength="3" maxlength="20">
      </label>
      <label>Password
        <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8">
      </label>
      <label id="invite-row" hidden>Invite code
        <input id="invite" name="invite" autocomplete="off">
      </label>
      <p id="auth-error" role="alert"></p>
      <button class="primary" id="auth-submit" type="submit">Log in</button>
    </form>
  </main>

  <div id="app" hidden>
    <aside id="side">
      <header class="side-head">
        <div>
          <strong id="me-name"></strong>
          <span class="sub">Signed in</span>
        </div>
        <button id="logout" type="button" class="ghost">Log out</button>
      </header>
      <input id="search" type="search" placeholder="Find a friend by username" autocomplete="off">
      <ul id="list"></ul>
    </aside>

    <section id="chat">
      <div id="empty">
        <h2>Pick a conversation</h2>
        <p>Choose a chat on the left, or search for a friend's username to start a new one.</p>
      </div>
      <div id="chat-pane" hidden>
        <header class="chat-head">
          <button id="back" type="button" class="ghost" aria-label="Back to chats">&larr;</button>
          <div class="avatar" id="peer-avatar"></div>
          <div>
            <strong id="peer-name"></strong>
            <span class="sub" id="peer-status"></span>
          </div>
        </header>
        <div id="messages" aria-live="polite"></div>
        <form id="composer" autocomplete="off">
          <input id="text" placeholder="Type a message" maxlength="2000" aria-label="Message">
          <button class="primary" type="submit">Send</button>
        </form>
      </div>
    </section>
  </div>

  <div id="toast" role="status"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
